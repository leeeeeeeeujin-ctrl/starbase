version: '3.8'
services:
  redis:
    image: redis:7
    container_name: starbase_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

# Usage:
#  docker compose -f docker-compose.redis.yml up -d
#  export REDIS_URL=redis://127.0.0.1:6379
#  node ai-roomchat/tests/proxy/run_e2e_proxy.js
