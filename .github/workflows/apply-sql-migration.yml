---
name: Apply SQL migration (manual)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file in the repository (relative)'
        required: true
        default: 'docs/sql/20251025_add_recompute_queue.sql'
      confirm:
        description: 'Set to "yes" to actually execute the SQL. Defaults to "no" to avoid accidents.'
        required: true
        default: 'no'

jobs:
  apply-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clients (psql + supabase-cli)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl
          # supabase CLI install (use latest stable release install script if available)
          curl -sSfL https://raw.githubusercontent.com/supabase/cli/master/install.sh | sh || true

      - name: Apply SQL migration (control-plane preferred)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -euo pipefail
          SQL_FILE="${{ github.event.inputs.sql_file }}"
          CONFIRM="${{ github.event.inputs.confirm }}"

          if [ -z "$SQL_FILE" ]; then
            echo "ERROR: sql_file input is empty" >&2
            exit 1
          fi

          echo "Requested SQL file: $SQL_FILE"
          if [ "$CONFIRM" != "yes" ]; then
            echo "Confirm input is not 'yes' — skipping execution. To run, re-dispatch and set confirm: 'yes'" >&2
            exit 0
          fi

          # Prefer control-plane (supabase CLI) when a service token + PROJECT_URL present
          # Choose token from SUPABASE_ACCESS_TOKEN or SUPABASE_SERVICE_ROLE_KEY
          TOKEN=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            TOKEN="$SUPABASE_ACCESS_TOKEN"
          elif [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            TOKEN="$SUPABASE_SERVICE_ROLE_KEY"
          fi

          if [ -n "$TOKEN" ] && [ -n "${SUPABASE_PROJECT_URL:-}" ]; then
            echo "Using supabase CLI (control-plane) to run SQL"
            echo "--- SQL file content preview ---"
            sed -n '1,200p' "$SQL_FILE" || true
            echo "--- end preview ---"

            export SUPABASE_ACCESS_TOKEN="$TOKEN"
            export SUPABASE_URL="$SUPABASE_PROJECT_URL"

            # Try to run SQL using supabase CLI; if CLI doesn't accept file flag, fallback to piping
            if command -v supabase >/dev/null 2>&1; then
              # Try direct file mode
              if supabase db query --file "$SQL_FILE" 2>/tmp/supabase_db_query.err; then
                echo "supabase db query succeeded"
              else
                echo "supabase db query failed, trying to pipe via stdin (debug follows)"
                cat /tmp/supabase_db_query.err || true
                supabase db query < "$SQL_FILE"
              fi
            else
              echo "supabase CLI not available; failing" >&2
              exit 1
            fi

          else
            # Fallback to psql using SUPABASE_DB_URL
            if [ -z "${SUPABASE_DB_URL:-}" ]; then
              echo "ERROR: no SUPABASE_ACCESS_TOKEN+SUPABASE_PROJECT_URL and no SUPABASE_DB_URL available" >&2
              exit 1
            fi
            echo "Using psql (SUPABASE_DB_URL) to run SQL"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
          fi

      - name: Verify migration - check expected tables
        if: ${{ success() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -euo pipefail
          echo "Verifying devices and device_events existence"
          # If we have a DB URL, use psql for verification (preferred)
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.devices') AS devices, to_regclass('public.device_events') AS device_events;"
            exit 0
          fi

          # Otherwise, if supabase control-plane is available, use supabase CLI to run a verification query
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_PROJECT_URL:-}" ]; then
            export SUPABASE_ACCESS_TOKEN
            export SUPABASE_URL="$SUPABASE_PROJECT_URL"
            if command -v supabase >/dev/null 2>&1; then
              echo "SELECT to_regclass('public.devices') AS devices, to_regclass('public.device_events') AS device_events;" > /tmp/verify.sql
              supabase db query --file /tmp/verify.sql || supabase db query < /tmp/verify.sql
            else
              echo "supabase CLI not installed; cannot verify via control-plane" >&2
              exit 1
            fi
          else
            echo "No verification path available (no SUPABASE_DB_URL and no control-plane creds)" >&2
            exit 1
          fi

