---
name: Nightly Fuzzer

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  nightly-fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-roomchat/starbase/ai-roomchat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install
        run: npm ci

      - name: Run fuzz tests (nightly)
        run: npm run test:fuzz

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report
          path: ai-roomchat/starbase/ai-roomchat/reports/fuzzer
          if-no-files-found: warn
          retention-days: 14

