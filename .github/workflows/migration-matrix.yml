name: Migration CI matrix (stub)

on:
  pull_request:
    paths:
      - 'ai-roomchat/sql/**'
      - '.github/workflows/run-migrations.yml'

jobs:
  migration-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
        step: [dry-run]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install minimal deps
        run: |
          cd ai-roomchat
          npm ci --ignore-scripts --no-audit || true

      - name: Run migration dry-run (matrix stub)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd ai-roomchat
          node ./scripts/apply-migrations.js --dry-run || true

      - name: Upload matrix logs
        uses: actions/upload-artifact@v4
        with:
          name: migration-matrix-${{ matrix.node }}-${{ matrix.step }}
          path: ai-roomchat/reports/migrations-*.log
