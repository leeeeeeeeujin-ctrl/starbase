name: Run arbitrary command (manual dispatch)

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'The shell command to run (single line)'
        required: true
        default: 'echo hello from workflow'

jobs:
  run-cmd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (not needed but useful for context)
        uses: actions/checkout@v4

      - name: Print command
        run: |
          echo "Running command:" 
          echo "${{ github.event.inputs.cmd }}"

      - name: Run provided command (shell)
        run: |
          # CAUTION: this runs whatever you pass in the 'cmd' input on a GitHub runner.
          # Only dispatch this workflow with commands you trust.
          bash -lc "${{ github.event.inputs.cmd }}"
