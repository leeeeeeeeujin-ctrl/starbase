name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ai-roomchat/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-roomchat/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci
        working-directory: ai-roomchat
      - name: Run tests
        run: npm test
        working-directory: ai-roomchat
