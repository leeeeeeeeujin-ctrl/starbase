name: "Apply SQL migration (manual)"

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file in the repository (relative)'
        required: true
        default: 'ai-roomchat/sql/002_add_devices_and_prompt_runs.sql'
      confirm:
        description: 'Set to "yes" to actually execute the SQL. Defaults to "no" to avoid accidents.'
        required: true
        default: 'no'

jobs:
  apply-sql:
    runs-on: ubuntu-latest
    name: Apply SQL migration (manual)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3 python3-requests curl ca-certificates

      - name: Apply SQL migration (psql with IPv4 hostaddr fallback)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -euo pipefail
          SQL_FILE="${{ github.event.inputs.sql_file }}"
          CONFIRM="${{ github.event.inputs.confirm }}"

          if [ -z "$SQL_FILE" ]; then
            echo "ERROR: sql_file input is empty" >&2
            exit 1
          fi

          echo "Requested SQL file: $SQL_FILE"
          echo "Working directory: $(pwd)"

          # If SUPABASE_ACCESS_TOKEN isn't provided but SUPABASE_SERVICE_ROLE_KEY is, use it for CLI control-plane operations
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN not found; falling back to SUPABASE_SERVICE_ROLE_KEY for SUPABASE_ACCESS_TOKEN"
            export SUPABASE_ACCESS_TOKEN="$SUPABASE_SERVICE_ROLE_KEY"
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Warning: SUPABASE_ACCESS_TOKEN is not set. If you expect CLI control-plane operations to run, set SUPABASE_ACCESS_TOKEN or SUPABASE_SERVICE_ROLE_KEY in repo secrets." >&2
          fi

          if [ ! -f "$SQL_FILE" ]; then
            echo "SQL file not found at requested path: $SQL_FILE"
            FOUND="$(git ls-files | grep '002_add_devices_and_prompt_runs.sql' | head -n1 || true)"
            if [ -z "$FOUND" ]; then
              FOUND="$(find . -type f -name '002_add_devices_and_prompt_runs.sql' -print -quit || true)"
            fi
            if [ -n "$FOUND" ]; then
              echo "Discovered SQL file at: $FOUND"
              SQL_FILE="$FOUND"
            else
              echo "Could not locate SQL file in repository. Listing candidate SQL files for debugging:" >&2
              git ls-files | grep '\.sql$' || true
              exit 1
            fi
          fi

          if [ "$CONFIRM" != "yes" ]; then
            echo "Confirm input is not 'yes' — skipping execution. To run, re-dispatch and set confirm: 'yes'" >&2
            exit 0
          fi

          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "Using psql (SUPABASE_DB_URL) to run SQL"
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$SQL_FILE"; then
              echo "psql executed SQL successfully"
            else
              echo "psql execution failed; attempting IPv4 hostaddr fallback" >&2
              # parse connection components using helper script
              export TARGET_SUPABASE_DB_URL="$SUPABASE_DB_URL"
              eval "$(python3 .github/scripts/parse_supabase_db_url.py "$TARGET_SUPABASE_DB_URL")"
              IP="$(python3 .github/scripts/resolve_ipv4.py "$PGHOST")"
              if [ -n "$IP" ]; then
                echo "Resolved IPv4 for $PGHOST -> $IP"
                CONN="hostaddr=$IP host=$PGHOST port=$PGPORT user=$PGUSER password=$PGPASSWORD dbname=$PGDATABASE sslmode=require"
                psql "$CONN" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
              else
                echo "Could not resolve an IPv4 address for $PGHOST; cannot apply IPv4 fallback" >&2
                exit 1
              fi
            fi
          else
            echo "No SUPABASE_DB_URL provided; control-plane path requires supabase CLI and project URL"
            if command -v supabase >/dev/null 2>&1 && [ -n "${SUPABASE_PROJECT_URL:-}" ]; then
              echo "supabase CLI present; attempting control-plane actions (may not allow arbitrary SQL)"
              echo "--- SQL preview ---"
              sed -n '1,200p' "$SQL_FILE" || true
              echo "--- end preview ---"
              echo "Please apply SQL manually in the Supabase SQL editor if control-plane push is insufficient."
              exit 1
            else
              echo "No way to apply SQL: missing SUPABASE_DB_URL and no supabase CLI/project URL available" >&2
              exit 1
            fi
          fi

      - name: Verify migration - check expected tables
        if: ${{ success() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.devices') AS devices, to_regclass('public.device_events') AS device_events;"
          else
            echo "No SUPABASE_DB_URL; cannot verify automatically"
            exit 1
          fi
