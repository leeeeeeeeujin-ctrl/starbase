name: Push changes with deploy key

on:
  workflow_dispatch:

jobs:
  push-with-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          # Use SSH remote to push
          git remote set-url origin git@github.com:leeeeeeeeujin-ctrl/starbase.git

      - name: Ensure dump workflow exists
        run: |
          # If the file is missing for any reason, copy from repository (should already exist)
          if [ ! -f .github/workflows/dump-finalize-with-psql.yml ]; then
            echo "WARNING: dump-finalize-with-psql.yml missing" >&2
          fi

      - name: Commit & push any changes
        env:
          GIT_SSH_COMMAND: 'ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no'
        run: |
          git add .github/workflows/dump-finalize-with-psql.yml || true
          git add .github/workflows || true
          git commit -m "ci: ensure dump-finalize-with-psql workflow present" || echo "no changes to commit"
          git push origin HEAD:main
