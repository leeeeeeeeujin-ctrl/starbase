name: CI — tests + device-run integration

on:
  push:
    branches: [ main, chore/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ai-roomchat

      - name: Run Jest tests
        run: npm test --silent
        working-directory: ai-roomchat

      - name: Run device-run integration (mock runner + test)
        run: npm run dev:runner-test --silent
        working-directory: ai-roomchat
