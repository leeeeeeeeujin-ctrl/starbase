name: Run DB Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (maps to a GitHub Environment). Use a protected environment (e.g. production) for manual approval.'
        required: true
        default: 'production'
      dry_run:
        description: 'If true, perform dry-run (default true)'
        required: true
        default: 'true'

jobs:
  preflight:
    name: Preflight & dry-run
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.set.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load MIGRATE_DATABASE_URL from existing secrets
        run: |
          # Prefer an explicit MIGRATE_DATABASE_URL secret; fall back to DATABASE_URL or SUPABASE_DB_URL
          if [ -n "${{ secrets.MIGRATE_DATABASE_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.MIGRATE_DATABASE_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.SUPABASE_DB_URL }}" >> $GITHUB_ENV
          else
            echo "MIGRATE_DATABASE_URL not found in secrets; continuing without it"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install runtime dependency (pg only)
        run: |
          cd ai-roomchat
          # avoid full `npm ci` in CI preflight (lockfile may be out of sync); install only runtime pg driver
          npm install --no-save --no-audit --no-fund pg@^8.10.0 || true

      - name: Run migration dry-run (node helper)
        id: run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          echo "DRY_RUN=${{ github.event.inputs.dry_run }}" > dry_run_flag
          # prefer MIGRATE_DATABASE_URL when available in helper
          node ./ai-roomchat/scripts/apply-migrations.js --dry-run || true
          echo "done" > preflight_done
        # capture input so later jobs can decide
      - name: Set outputs
        id: set
        run: |
          echo "::set-output name=dry_run::${{ github.event.inputs.dry_run }}"

  backup:
    name: Create DB backup
    runs-on: ubuntu-latest
    needs: preflight
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load MIGRATE_DATABASE_URL from existing secrets
        run: |
          # Prefer an explicit MIGRATE_DATABASE_URL secret; fall back to DATABASE_URL or SUPABASE_DB_URL
          if [ -n "${{ secrets.MIGRATE_DATABASE_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.MIGRATE_DATABASE_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.SUPABASE_DB_URL }}" >> $GITHUB_ENV
          else
            echo "MIGRATE_DATABASE_URL not found in secrets; skipping backup"
          fi

      - name: Install pg client
        run: |
          sudo apt-get update -y
          # install PostgreSQL client matching server version (prefer pg 17)
          sudo apt-get install -y wget ca-certificates lsb-release gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17 || sudo apt-get install -y postgresql-client

      - name: Create DB dump
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # prefer migrate secret for consistent pooler connection
          CONN="$MIGRATE_DATABASE_URL"
          if [ -z "$CONN" ]; then
            CONN="$DATABASE_URL"
          fi
          if [ -z "$CONN" ] && [ -n "$SUPABASE_DB_URL" ]; then
            CONN="$SUPABASE_DB_URL"
          fi
          if [ -z "$CONN" ]; then
            echo "No DB connection secret found. Skipping backup."; exit 0
          fi

          # Choose a pg_dump binary that matches server major version (prefer 17)
          # Try versioned locations first, then fallback to system pg_dump
          PGDUMP_CANDIDATES=("/usr/lib/postgresql/17/bin/pg_dump" "pg_dump-17" "pg_dump")
          PGDUMP_BIN=""
          for c in "${PGDUMP_CANDIDATES[@]}"; do
            if command -v "$c" >/dev/null 2>&1; then
              # verify major version
              ver=$($c --version 2>/dev/null || true)
              echo "Found pg_dump candidate: $c -> $ver"
              if echo "$ver" | grep -qE "\b([0-9]+)\."; then
                maj=$(echo "$ver" | sed -E 's/.* ([0-9]+)\..*/\1/')
                if [ "$maj" = "17" ]; then
                  PGDUMP_BIN=$(command -v "$c")
                  break
                fi
              fi
            fi
          done

          if [ -z "$PGDUMP_BIN" ]; then
            echo "pg_dump v17 not found on PATH or standard locations. Attempting to use any pg_dump but failing if version mismatch.";
            if command -v pg_dump >/dev/null 2>&1; then
              PGDUMP_BIN=$(command -v pg_dump)
              echo "Using fallback pg_dump: $PGDUMP_BIN"
            else
              echo "No pg_dump available. Aborting backup."; exit 1
            fi
          fi

          # sanity check chosen binary
          echo "Selected pg_dump binary: $PGDUMP_BIN"
          $PGDUMP_BIN --version

          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          filename="migration-backup-${timestamp}.sql.gz"

          # Prefer explicit v17 binary when available (avoid PATH surprises)
          if [ -x "/usr/lib/postgresql/17/bin/pg_dump" ]; then
            PGDUMP_BIN="/usr/lib/postgresql/17/bin/pg_dump"
            echo "Forcing explicit pg_dump path: $PGDUMP_BIN"
            $PGDUMP_BIN --version || true
          fi

          # run pg_dump via chosen binary; fail if it exits non-zero
          if $PGDUMP_BIN "$CONN" | gzip > "$filename"; then
            echo "Created backup $filename"

            # quick verification: ensure gzip integrity and reasonable size
            echo "Verifying gzip integrity..."
            if gzip -t "$filename"; then
              echo "gzip integrity: OK"
            else
              echo "gzip integrity failed; removing partial backup and failing"
              rm -f "$filename" || true
              exit 1
            fi

            # sanity size check (avoid tiny partial files). Threshold: 10KB
            sz=$(stat -c%s "$filename" || echo 0)
            if [ "$sz" -lt 10240 ]; then
              echo "Backup file too small ($sz bytes); removing and failing"
              rm -f "$filename" || true
              exit 1
            fi

            echo "Backup verification passed: $filename ($sz bytes)"
            # compute sha256 checksum for reviewer verification
            echo "Computing sha256 checksum..."
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$filename" > "$filename.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$filename" > "$filename.sha256"
            else
              echo "No sha256 tool available; skipping checksum file generation"
            fi
          else
            echo "pg_dump failed or version mismatch; removing partial backup and failing";
            rm -f "$filename" || true
            exit 1
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-backup
          path: migration-backup-*.sql.gz

      - name: Upload backup to Supabase Storage (fallback / parallel)
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          # find the backup and checksum files
          FILE=$(ls migration-backup-*.sql.gz 2>/dev/null | head -n1 || true)
          SUMFILE=""
          if [ -n "$FILE" ]; then
            if [ -f "$FILE.sha256" ]; then
              SUMFILE="$FILE.sha256"
            else
              SUMFILE=$(ls migration-backup-*.sql.gz.sha256 2>/dev/null | head -n1 || true)
            fi
          fi
          if [ -z "$FILE" ]; then
            echo "No backup file found to upload to Supabase; skipping."; exit 0
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${SUPABASE_BUCKET:-}" ]; then
            echo "Supabase config (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SUPABASE_BUCKET) not fully set; skipping Supabase upload."; exit 0
          fi

          echo "Uploading $FILE to Supabase bucket: $SUPABASE_BUCKET"
          # Use the storage API: PUT /storage/v1/object/{bucket}/{object}
          RESP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${FILE}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/gzip" \
            --data-binary @"$FILE") || true

          if [ "$RESP_CODE" = "200" ] || [ "$RESP_CODE" = "201" ]; then
            echo "Supabase upload OK (HTTP $RESP_CODE)"
          else
            echo "Supabase upload returned HTTP $RESP_CODE; see runner logs for details";
            echo "Attempting debug upload (non-binary) to show response body..."
            curl -s -X PUT "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${FILE}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/gzip" \
              --data-binary @"$FILE" || true
          fi

          # upload checksum if available
          if [ -n "$SUMFILE" ] && [ -f "$SUMFILE" ]; then
            echo "Uploading checksum $SUMFILE to Supabase"
            RESP_CODE2=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${SUMFILE}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: text/plain" \
              --data-binary @"$SUMFILE") || true
            echo "Checksum upload HTTP: $RESP_CODE2"
          fi

          echo "Supabase object path: ${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${FILE} (if bucket is public)"

  apply:
    name: Apply migrations (approval if environment protected)
    runs-on: ubuntu-latest
    needs: backup
    environment: ${{ github.event.inputs.environment }}
    if: ${{ github.event.inputs.dry_run == 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load MIGRATE_DATABASE_URL from existing secrets
        run: |
          # Prefer an explicit MIGRATE_DATABASE_URL secret; fall back to DATABASE_URL or SUPABASE_DB_URL
          if [ -n "${{ secrets.MIGRATE_DATABASE_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.MIGRATE_DATABASE_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "MIGRATE_DATABASE_URL=${{ secrets.SUPABASE_DB_URL }}" >> $GITHUB_ENV
          else
            echo "MIGRATE_DATABASE_URL not found in secrets; apply will fail if no DB secret available"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (ensure dev deps)
        run: |
          cd ai-roomchat
          npm ci --include=dev
          npm install pg@^8.10.0 --no-save || true

      - name: Install pg client for verification
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget ca-certificates lsb-release gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17 || sudo apt-get install -y postgresql-client

      - name: Download and verify backup artifact
        uses: actions/download-artifact@v4
        with:
          name: migration-backup
          path: ./migration-backup

      - name: Fetch backup from Supabase if artifact missing
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE
          mkdir -p migration-backup
          # if artifact was downloaded by the download-artifact step, skip
          FILE=$(ls migration-backup/migration-backup-*.sql.gz 2>/dev/null | head -n1 || true)
          if [ -n "$FILE" ]; then
            echo "Artifact present ($FILE); skipping Supabase fetch"
            exit 0
          fi
          echo "Artifact missing; attempting to locate latest migration-backup in Supabase"
          sudo apt-get update -y
          sudo apt-get install -y jq curl || true
          LIST=$(curl -s -X POST "${SUPABASE_URL}/storage/v1/object/list/${SUPABASE_BUCKET}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Content-Type: application/json" -d '{"prefix":"","limit":50}')
          FILE=$(echo "$LIST" | jq -r 'sort_by(.metadata.lastModified) | last(.[]).name' || true)
          if [ -z "$FILE" ] || [ "$FILE" = "null" ]; then
            echo "No migration backup found in Supabase bucket ${SUPABASE_BUCKET}"; exit 1
          fi
          echo "Found backup in Supabase: $FILE"
          echo "Downloading $FILE"
          curl -s -X GET "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${FILE}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" --output "migration-backup/$FILE"
          # attempt to download checksum
          curl -s -X GET "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${FILE}.sha256" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" --output "migration-backup/$FILE.sha256" || true

      - name: Verify downloaded backup (gzip + header + size)
        run: |
          set -euo pipefail
          cd migration-backup
          FILE=$(ls migration-backup-*.sql.gz 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "No backup artifact found in migration-backup/; failing"; exit 1
          fi
          echo "Verifying artifact: $FILE"
          # gzip integrity
          if ! gzip -t "$FILE"; then
            echo "gzip integrity failed"; exit 1
          fi
          # size sanity
          sz=$(stat -c%s "$FILE" || echo 0)
          if [ "$sz" -lt 10240 ]; then
            echo "Backup file too small ($sz bytes); failing"; exit 1
          fi
          # quick header check to ensure it's SQL-ish
          if ! zcat "$FILE" | head -n 20 | grep -E '^(--|SET|CREATE|SELECT|COPY)' >/dev/null 2>&1; then
            echo "Backup header doesn't look like SQL dump; failing"; exit 1
          fi
          echo "Backup artifact verification passed: $FILE ($sz bytes)"

      - name: Compare checksum with .sha256 (if present)
        run: |
          set -euo pipefail
          cd migration-backup
          FILE=$(ls migration-backup-*.sql.gz 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "No backup file found for checksum compare"; exit 1
          fi
          if [ -f "$FILE.sha256" ]; then
            echo "Found checksum file: $FILE.sha256. Comparing..."
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c --status "$FILE.sha256" || (echo "Checksum mismatch"; exit 1)
            elif command -v shasum >/dev/null 2>&1; then
              SHASUM=$(shasum -a 256 "$FILE" | awk '{print $1}')
              EXPECT=$(awk '{print $1}' "$FILE.sha256")
              if [ "$SHASUM" != "$EXPECT" ]; then
                echo "Checksum mismatch: computed=$SHASUM expected=$EXPECT"; exit 1
              fi
            else
              echo "No sha256 tool available in runner to compare checksums; please verify manually"; exit 1
            fi
            echo "Checksum verified OK"
          else
            echo "No checksum file present; skipping checksum compare"
          fi

      - name: Apply migrations (node helper)
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # prefer MIGRATE_DATABASE_URL
          if [ -n "$MIGRATE_DATABASE_URL" ]; then
            echo "Using MIGRATE_DATABASE_URL"
            node ./ai-roomchat/scripts/apply-migrations.js --databaseUrl "$MIGRATE_DATABASE_URL"
          else
            if [ -n "$DATABASE_URL" ]; then
              node ./ai-roomchat/scripts/apply-migrations.js --databaseUrl "$DATABASE_URL"
            elif [ -n "$SUPABASE_DB_URL" ]; then
              node ./ai-roomchat/scripts/apply-migrations.js --databaseUrl "$SUPABASE_DB_URL"
            else
              echo "No DB secret available for apply. Failing."; exit 1
            fi
          fi

      - name: Run smoke tests (ai-roomchat)
        working-directory: ai-roomchat
        run: |
          npm test --if-present || true

      - name: Upload migration logs
        uses: actions/upload-artifact@v4
        with:
          name: migrations-log
          path: ai-roomchat/reports/migrations-*.log
