name: Validate required secrets

on:
  workflow_dispatch: {}

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.DATABASE_URL }}" ] && [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "ERROR: No DATABASE_URL or SUPABASE_SERVICE_ROLE_KEY found. Add one to repository secrets."; missing=1
          fi
          if [ -z "${{ secrets.MASTER_KEY_HEX }}" ]; then
            echo "ERROR: MASTER_KEY_HEX is not set. Add MASTER_KEY_HEX to secrets."; missing=1
          fi
          if [ $missing -ne 0 ]; then
            echo "One or more required secrets are missing. Aborting."; exit 1
          fi
          echo "All required secrets present."
