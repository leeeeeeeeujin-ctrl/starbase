name: Dump finalize functions and recent logs (psql)

on:
  workflow_dispatch:

jobs:
  dump-with-psql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql (postgresql-client)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Dump finalize function definitions and recent logs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "ERROR: SUPABASE_DB_URL secret is not set" >&2
            exit 1
          fi

          echo "Checking psql version"
          psql --version || true

          echo "Dumping finalize function definitions to finalize-defs.txt"
          psql "$SUPABASE_DB_URL" -At -c "SELECT proname || E'\n' || pg_get_functiondef(p.oid) FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid WHERE n.nspname = 'public' AND proname LIKE 'finalize_rank_session_outcome%';" > finalize-defs.txt || true

          echo "Dumping recent rank_session_battle_logs to recent-logs.json and recent-logs.tsv"
          # JSON aggregation (single JSON array)
          psql "$SUPABASE_DB_URL" -At -c "SELECT jsonb_agg(t) FROM (SELECT id, created_at, payload FROM public.rank_session_battle_logs ORDER BY created_at DESC LIMIT 50) t;" > recent-logs.json || true

          # TSV for easier grepping in runner logs (tab-separated with header)
          psql "$SUPABASE_DB_URL" -c "COPY (SELECT id, created_at, payload FROM public.rank_session_battle_logs ORDER BY created_at DESC LIMIT 50) TO STDOUT WITH (FORMAT csv, HEADER true, DELIMITER E'\t');" > recent-logs.tsv || true

          echo "Files written:"
          ls -la finalize-defs.txt recent-logs.json recent-logs.tsv || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finalize-dumps
          path: |
            finalize-defs.txt
            recent-logs.json
            recent-logs.tsv
