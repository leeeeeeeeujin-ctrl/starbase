name: Query recent rank_session_battle_logs channels

on:
  workflow_dispatch: {}
  push:
    branches:
      - apply-sql-now

jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          set -e
          echo "Downloading supabase CLI binary..."
          curl -L -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase || true
          sudo chmod +x /usr/local/bin/supabase || true

      - name: Query recent channels
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -e
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_PROJECT_URL" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY or SUPABASE_PROJECT_URL secret" >&2
            exit 1
          fi

          PROJECT_REF=$(echo "$SUPABASE_PROJECT_URL" | sed -E 's#https?://([^.]*)\..*#\1#')
          echo "Project ref: $PROJECT_REF"
          export SUPABASE_ACCESS_TOKEN="$SUPABASE_SERVICE_ROLE_KEY"

          printf '%s\n' \
            "SELECT id, payload -> 'channels' AS channels, created_at" \
            "FROM public.rank_session_battle_logs" \
            "ORDER BY created_at DESC" \
            "LIMIT 5;" > /tmp/query.sql

          set +e
          cat /tmp/query.sql | supabase db query --project-ref "$PROJECT_REF" --service-role-key "$SUPABASE_SERVICE_ROLE_KEY" --yes
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "supabase db query succeeded (with flags)"
            exit 0
          fi

          cat /tmp/query.sql | supabase db query --yes
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "supabase db query succeeded (stdin, no flags)"
            exit 0
          fi

          supabase db query --yes < /tmp/query.sql
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "supabase db query succeeded (stdin via redirection)"
            exit 0
          fi

          echo "All supabase CLI attempts failed. Printing diagnostics." >&2
          supabase --version || true
          supabase db --help || true
          exit 1
          set -e
