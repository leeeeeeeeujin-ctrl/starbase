name: Run Supabase SQL (direct)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Repo-relative path to SQL file'
        required: true
        default: 'ai-roomchat/sql/002_add_devices_and_prompt_runs.sql'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug listing
        run: |
          echo "PWD: $(pwd)"
          echo "--- root ---"
          ls -la || true
          echo "--- ai-roomchat/sql ---"
          ls -la ai-roomchat/sql || true
          echo "--- git ls-files for sql basename ---"
          git ls-files | grep '002_add_devices_and_prompt_runs.sql' || true

      - name: Install Supabase CLI
        run: |
          curl -L -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          sudo chmod +x /usr/local/bin/supabase

      - name: Run SQL via supabase db query
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -e
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_PROJECT_URL" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY or SUPABASE_PROJECT_URL" >&2
            exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_PROJECT_URL" | sed -E 's#https?://([^.]*)\..*#\1#')
          echo "Project: $PROJECT_REF"
          export SUPABASE_ACCESS_TOKEN="$SUPABASE_SERVICE_ROLE_KEY"
          SQL_FILE="${{ github.event.inputs.sql_file }}"
          # If the supplied path doesn't exist, try to discover the file in the repo
          if [ ! -f "$SQL_FILE" ]; then
            echo "SQL file not found at $SQL_FILE; searching repository for 002_add_devices_and_prompt_runs.sql"
            FOUND=$(git ls-files | grep '002_add_devices_and_prompt_runs.sql' | head -n1 || true)
            if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
              echo "Found candidate: $FOUND"
              SQL_FILE="$FOUND"
            else
              # Try a couple of likely alternate locations
              CANDIDATES=( "starbase/ai-roomchat/sql/002_add_devices_and_prompt_runs.sql" "ai-roomchat/ai-roomchat/sql/002_add_devices_and_prompt_runs.sql" "docs/sql/ai-roomchat/sql/002_add_devices_and_prompt_runs.sql" )
              for C in "${CANDIDATES[@]}"; do
                if [ -f "$C" ]; then
                  echo "Found candidate: $C"
                  SQL_FILE="$C"
                  break
                fi
              done
            fi
          fi
          if [ ! -f "$SQL_FILE" ]; then
            echo "SQL file still not found; aborting. Checked: $SQL_FILE" >&2
            echo "Run 'git ls-files | grep 002_add_devices_and_prompt_runs.sql' to inspect available files" >&2
            exit 1
          fi
          echo "Running: $SQL_FILE"
          # Use the service role token via SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_URL
          # The CLI will use these environment variables to target the correct project (control-plane).
          # Use only the access token and project URL in the environment; the CLI will
          # pick up the target project from SUPABASE_PROJECT_URL when possible.
          SUPABASE_ACCESS_TOKEN="$SUPABASE_SERVICE_ROLE_KEY" SUPABASE_PROJECT_URL="$SUPABASE_PROJECT_URL" bash -c "cat '$SQL_FILE' | supabase db query --yes"
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "supabase db query failed with code $RC" >&2
            supabase --version || true
            supabase db --help || true
            exit $RC
          fi
