---
name: Apply SQL migration (manual)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file in the repository (relative)'
        required: true
        default: 'docs/sql/20251025_add_recompute_queue.sql'
      confirm:
        description: 'Set to "yes" to actually execute the SQL. Defaults to "no" to avoid accidents.'
        required: true
        default: 'no'

jobs:
  apply-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clients (psql + supabase-cli)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl ca-certificates tar gzip
          echo "Attempting to install supabase CLI via GitHub Releases (robust lookup)..."
          ARCH="$(uname -m)"
          # prefer amd64 vs arm64 naming
          if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
            WANT_ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            WANT_ARCH="arm64"
          else
            echo "Unsupported architecture: $ARCH" >&2
            WANT_ARCH="amd64"
          fi

          # Discover latest release asset URL using GitHub API
          API_JSON="$(curl -fsSL https://api.github.com/repos/supabase/cli/releases/latest)" || true
          DOWNLOAD_URL="$(printf "%s" "$API_JSON" | grep -E 'browser_download_url' | grep linux | grep "$WANT_ARCH" | head -n1 | cut -d '"' -f4 || true)"
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Could not find a matching supabase CLI release asset via API; trying generic asset names as fallback" >&2
            # fallback candidate names (may 404)
            if [ "$WANT_ARCH" = "amd64" ]; then
              CAND="supabase_linux_amd64.tar.gz"
            else
              CAND="supabase_linux_arm64.tar.gz"
            fi
            DOWNLOAD_URL="https://github.com/supabase/cli/releases/latest/download/$CAND"
          fi

          echo "Downloading supabase from: $DOWNLOAD_URL"
          if curl -fsSL "$DOWNLOAD_URL" -o /tmp/supabase.tar.gz; then
            sudo tar -C /usr/local/bin -xzf /tmp/supabase.tar.gz || true
            # some tarballs contain a supabase binary at top-level, others a folder
            if [ -x /usr/local/bin/supabase ]; then
              echo "supabase installed: $(/usr/local/bin/supabase --version 2>/dev/null || echo 'unknown')"
            else
              # try to extract binary from archive and move it
              TMPDIR=$(mktemp -d)
              tar -C "$TMPDIR" -xzf /tmp/supabase.tar.gz
              BINPATH="$(find "$TMPDIR" -type f -name supabase -perm /111 | head -n1 || true)"
              if [ -n "$BINPATH" ]; then
                sudo mv "$BINPATH" /usr/local/bin/supabase
                sudo chmod +x /usr/local/bin/supabase || true
                echo "supabase installed: $(/usr/local/bin/supabase --version 2>/dev/null || echo 'unknown')"
              else
                echo "Downloaded supabase tarball but could not locate 'supabase' binary inside" >&2
              fi
            fi
          else
            echo "Failed to download supabase CLI from $DOWNLOAD_URL" >&2
            echo "Continuing without supabase CLI; workflow will fallback to psql if available."
          fi

      - name: Apply SQL migration (control-plane preferred)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -euo pipefail
          SQL_FILE="${{ github.event.inputs.sql_file }}"
          CONFIRM="${{ github.event.inputs.confirm }}"

          if [ -z "$SQL_FILE" ]; then
            echo "ERROR: sql_file input is empty" >&2
            exit 1
          fi

          echo "Requested SQL file: $SQL_FILE"
          echo "Working directory: $(pwd)"
          echo "Top-level files:" && ls -la . | sed -n '1,200p' || true

          # If the requested SQL file path doesn't exist, try to discover it in the repo
          if [ ! -f "$SQL_FILE" ]; then
            echo "SQL file not found at requested path: $SQL_FILE"
            # Try git ls-files first (respects repo layout)
            FOUND="$(git ls-files | grep -E '002_add_devices_and_prompt_runs.sql$' | head -n1 || true)"
            if [ -z "$FOUND" ]; then
              # fallback to filesystem search (may be slower)
              FOUND="$(find . -type f -name '002_add_devices_and_prompt_runs.sql' -print -quit || true)"
            fi
            if [ -n "$FOUND" ]; then
              echo "Discovered SQL file at: $FOUND"
              SQL_FILE="$FOUND"
            else
              echo "Could not locate SQL file in repository. Listing candidate SQL files for debugging:" >&2
              git ls-files | grep '\.sql$' || true
              exit 1
            fi
          fi
          if [ "$CONFIRM" != "yes" ]; then
            echo "Confirm input is not 'yes' — skipping execution. To run, re-dispatch and set confirm: 'yes'" >&2
            exit 0
          fi

          # Prefer control-plane (supabase CLI) when a service token + PROJECT_URL present
          # Choose token from SUPABASE_ACCESS_TOKEN or SUPABASE_SERVICE_ROLE_KEY
          TOKEN=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            TOKEN="$SUPABASE_ACCESS_TOKEN"
          elif [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            TOKEN="$SUPABASE_SERVICE_ROLE_KEY"
          fi

          if [ -n "$TOKEN" ] && [ -n "${SUPABASE_PROJECT_URL:-}" ]; then
            echo "Using supabase CLI (control-plane) to run SQL"
            echo "--- SQL file content preview ---"
            sed -n '1,200p' "$SQL_FILE" || true
            echo "--- end preview ---"

            export SUPABASE_ACCESS_TOKEN="$TOKEN"
            export SUPABASE_URL="$SUPABASE_PROJECT_URL"

            # Try to run SQL using supabase CLI; if CLI doesn't accept file flag, fallback to piping
            if command -v supabase >/dev/null 2>&1; then
              # Try direct file mode
              if supabase db query --file "$SQL_FILE" 2>/tmp/supabase_db_query.err; then
                echo "supabase db query succeeded"
              else
                echo "supabase db query failed, trying to pipe via stdin (debug follows)"
                cat /tmp/supabase_db_query.err || true
                supabase db query < "$SQL_FILE"
              fi
            else
              echo "supabase CLI not available; failing" >&2
              exit 1
            fi

          else
            # Fallback to psql using SUPABASE_DB_URL
            if [ -z "${SUPABASE_DB_URL:-}" ]; then
              echo "ERROR: no SUPABASE_ACCESS_TOKEN+SUPABASE_PROJECT_URL and no SUPABASE_DB_URL available" >&2
              exit 1
            fi
            echo "Using psql (SUPABASE_DB_URL) to run SQL"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
          fi

      - name: Verify migration - check expected tables
        if: ${{ success() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -euo pipefail
          echo "Verifying devices and device_events existence"
          # If we have a DB URL, use psql for verification (preferred)
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.devices') AS devices, to_regclass('public.device_events') AS device_events;"
            exit 0
          fi

          # Otherwise, if supabase control-plane is available, use supabase CLI to run a verification query
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_PROJECT_URL:-}" ]; then
            export SUPABASE_ACCESS_TOKEN
            export SUPABASE_URL="$SUPABASE_PROJECT_URL"
            if command -v supabase >/dev/null 2>&1; then
              echo "SELECT to_regclass('public.devices') AS devices, to_regclass('public.device_events') AS device_events;" > /tmp/verify.sql
              supabase db query --file /tmp/verify.sql || supabase db query < /tmp/verify.sql
            else
              echo "supabase CLI not installed; cannot verify via control-plane" >&2
              exit 1
            fi
          else
            echo "No verification path available (no SUPABASE_DB_URL and no control-plane creds)" >&2
            exit 1
          fi

