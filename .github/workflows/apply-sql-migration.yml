---
name: Apply SQL migration (manual)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file in the repository (relative)'
        required: true
        default: 'docs/sql/20251025_add_recompute_queue.sql'
      confirm:
        description: 'Set to "yes" to actually execute the SQL. Defaults to "no" to avoid accidents.'
        required: true
        default: 'no'

jobs:
  apply-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply SQL migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          # workflow_dispatch inputs are available under github.event.inputs
          SQL_FILE="${{ github.event.inputs.sql_file }}"
          CONFIRM="${{ github.event.inputs.confirm }}"

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "ERROR: SUPABASE_DB_URL secret is not set" >&2
            exit 1
          fi

          if [ -z "$SQL_FILE" ]; then
            echo "ERROR: sql_file input is empty" >&2
            exit 1
          fi

          echo "Requested SQL file: $SQL_FILE"
          if [ "$CONFIRM" != "yes" ]; then
            echo "Confirm input is not 'yes' ??skipping execution. To run, re-dispatch and set confirm: 'yes'" >&2
            exit 0
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$SQL_FILE"

