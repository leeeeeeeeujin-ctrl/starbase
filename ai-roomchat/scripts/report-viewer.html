<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prompt PoC Reports</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 20px;
      }
      #files {
        width: 300px;
        float: left;
      }
      #detail {
        margin-left: 320px;
      }
      pre {
        background: #f6f8fa;
        padding: 10px;
        border-radius: 6px;
        max-height: 70vh;
        overflow: auto;
      }
      .btn {
        padding: 6px 10px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Prompt PoC Reports</h2>
    <div id="files">
      <button id="refresh" class="btn">Refresh</button>
      <ul id="list"></ul>
    </div>
    <div id="detail">
      <h3 id="title">No report selected</h3>
      <div id="meta"></div>
      <pre id="json">{}</pre>
    </div>

    <script>
      const listEl = document.getElementById('list');
      const jsonEl = document.getElementById('json');
      const titleEl = document.getElementById('title');
      const refreshBtn = document.getElementById('refresh');

      async function fetchReports() {
        const res = await fetch('/api/reports');
        const files = await res.json();
        listEl.innerHTML = '';
        files.forEach(f => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '#';
          a.textContent = f;
          a.onclick = e => {
            e.preventDefault();
            loadReport(f);
          };
          li.appendChild(a);
          listEl.appendChild(li);
        });
      }

      async function loadReport(name) {
        titleEl.textContent = name;
        const res = await fetch('/api/reports/' + encodeURIComponent(name));
        if (!res.ok) {
          jsonEl.textContent = 'Failed to load';
          return;
        }
        const data = await res.json();
        jsonEl.textContent = JSON.stringify(data, null, 2);
      }

      refreshBtn.onclick = fetchReports;
      fetchReports();

      // SSE for live updates
      const es = new EventSource('/events');
      es.addEventListener('update', () => {
        fetchReports();
      });
    </script>
  </body>
</html>
