name: Run DB Migrations

on:
  workflow_dispatch: {}

jobs:
  migrate:
    name: Apply SQL migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (ensure dev deps)
        run: |
          cd ai-roomchat
          # ensure devDependencies (like 'pg') are available for migration runner
          npm ci --include=dev
          # ensure 'pg' is present even if lockfile omitted it; install locally without saving
          npm install pg@^8.10.0 --no-save
          echo "-- check pg module exists --"
          ls -la node_modules/pg || echo "pg module not found"

      - name: Run migrations (with debug + fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # prefer DATABASE_URL, fall back to SUPABASE_SERVICE_ROLE_KEY if provided
          if [ -z "$DATABASE_URL" ] && [ -n "$SUPABASE_ROLE" ]; then
            export DATABASE_URL="$SUPABASE_ROLE"
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL (or SUPABASE_SERVICE_ROLE_KEY) not set in secrets"; exit 1
          fi
          # debug: show working dir and package.json to help diagnose 'Missing script' issues
          cd ai-roomchat
          echo "PWD: $(pwd)"
          echo "-- listing ai-roomchat --"
          ls -la
          echo "-- package.json contents (scripts) --"
          if [ -f package.json ]; then
            cat package.json | jq '.scripts' || cat package.json
          else
            echo "package.json not found in ai-roomchat"
          fi
          # try npm script first, then fall back to running the migration runner directly
          if npm run migrate:db; then
            echo "npm migrate:db succeeded"
          else
            echo "npm migrate:db failed or missing; attempting node scripts/apply-migrations.js"
            node scripts/apply-migrations.js
          fi

      - name: Verify migration - list sql files applied
        if: ${{ success() }}
        run: |
          echo "Migrations applied successfully."
