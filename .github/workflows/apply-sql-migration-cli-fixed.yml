name: "Apply SQL migration (supabase-cli - fixed)"

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file in the repository (relative)'
        required: true
        default: 'ai-roomchat/sql/002_add_devices_and_prompt_runs.sql'

jobs:
  apply-sql-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Debug: list workspace and SQL path"
        run: |
          echo "PWD: $(pwd)"
          echo "-- root listing --"
          ls -la || true
          echo "-- ai-roomchat/sql listing --"
          ls -la ai-roomchat/sql || true
          echo "-- git ls-files matching migration basename --"
          git ls-files | grep '002_add_devices_and_prompt_runs.sql' || true

      - name: Install Supabase CLI (official binary)
        run: |
          set -e
          echo "Downloading supabase CLI binary..."
          curl -L -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          sudo chmod +x /usr/local/bin/supabase

      - name: Show supabase version
        run: supabase --version

      - name: Run SQL via Supabase CLI
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          set -e
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_PROJECT_URL" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY or SUPABASE_PROJECT_URL secret" >&2
            exit 1
          fi

          PROJECT_REF=$(echo "$SUPABASE_PROJECT_URL" | sed -E 's#https?://([^.]*)\..*#\1#')
          echo "Project ref: $PROJECT_REF"

          export SUPABASE_ACCESS_TOKEN="$SUPABASE_SERVICE_ROLE_KEY"

          SQL_FILE="${{ github.event.inputs.sql_file }}"
          if [ -z "$SQL_FILE" ]; then
            echo "ERROR: sql_file input is empty" >&2
            exit 1
          fi

          # If SUPABASE_ACCESS_TOKEN isn't provided but SUPABASE_SERVICE_ROLE_KEY is, use it for CLI control-plane operations
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN not found; falling back to SUPABASE_SERVICE_ROLE_KEY for SUPABASE_ACCESS_TOKEN"
            export SUPABASE_ACCESS_TOKEN="$SUPABASE_SERVICE_ROLE_KEY"
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Warning: SUPABASE_ACCESS_TOKEN is not set. If you expect CLI control-plane operations to run, set SUPABASE_ACCESS_TOKEN or SUPABASE_SERVICE_ROLE_KEY in repo secrets." >&2
          fi

          CANDIDATE="$SQL_FILE"
          if [ ! -f "$CANDIDATE" ]; then
            BASENAME=$(basename "$SQL_FILE")
            FOUND=$(git ls-files | grep -F "${BASENAME}" | head -n1 || true)
            if [ -n "$FOUND" ]; then
              CANDIDATE="$FOUND"
            else
              if [ -f "ai-roomchat/$SQL_FILE" ]; then
                CANDIDATE="ai-roomchat/$SQL_FILE"
              elif [ -f "docs/sql/$SQL_FILE" ]; then
                CANDIDATE="docs/sql/$SQL_FILE"
              fi
            fi
          fi

          if [ ! -f "$CANDIDATE" ]; then
            echo "ERROR: SQL file not found at '$SQL_FILE' or common locations" >&2
            ls -la || true
            exit 1
          fi

          echo "Running SQL file: $CANDIDATE"
          set +e
          cat "$CANDIDATE" | supabase db query --project-ref "$PROJECT_REF" --service-role-key "$SUPABASE_SERVICE_ROLE_KEY" --yes
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "supabase db query succeeded"
            exit 0
          fi

          cat "$CANDIDATE" | supabase db query --yes
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "supabase db query succeeded"
            exit 0
          fi

          supabase db query --yes < "$CANDIDATE"
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "supabase db query succeeded"
            exit 0
          fi

          supabase --version || true
          supabase db --help || true
          exit 1
          set -e
