name: Dispatch - Run Node DB migrations (manual)

on:
  workflow_dispatch: {}

jobs:
  migrate:
    name: Run Node migration runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install runtime dependency (pg only)
        run: |
          cd ai-roomchat
          # don't run `npm ci` in CI here because package-lock.json may be out of sync
          # install only the runtime postgres driver we need for the migration runner
          npm install --no-save --no-audit --no-fund pg@^8.10.0

      - name: Restore npm / node_modules cache
        uses: actions/cache@v4
        with:
          # cache both the npm cache and the node_modules within ai-roomchat
          path: |
            ~/.npm
            ai-roomchat/node_modules
          # use package-lock.json as the cache key basis; falls back to os-node key
          key: ${{ runner.os }}-node-${{ hashFiles('ai-roomchat/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Node migration runner
        env:
          # prefer MIGRATE_DATABASE_URL (pooler); fall back to SUPABASE_DB_URL or DATABASE_URL
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
          DATABASE_POOLER_SESSION_URL: ${{ secrets.DATABASE_POOLER_SESSION_URL }}
          DATABASE_POOLER_TRANSACTION_URL: ${{ secrets.DATABASE_POOLER_TRANSACTION_URL }}
        run: |
          echo "--- debug: MIGRATE_DATABASE_URL present? ${MIGRATE_DATABASE_URL:+yes} ---"
          cd ai-roomchat
          echo "PWD: $(pwd)"
          echo "Listing ai-roomchat/sql files:" && ls -la sql || true
          node scripts/apply-migrations.js
