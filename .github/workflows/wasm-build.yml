name: WASM build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
        working-directory: ai-roomchat
      - name: Install wabt (wat2wasm)
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
        shell: bash
      - name: Build WASM (PoC)
        run: npm run wasm:build
        working-directory: ai-roomchat
