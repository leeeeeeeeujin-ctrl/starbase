---
name: run-ad-hoc-command

on:
  workflow_dispatch:
    inputs:
      shell:
        description: 'Shell to use (bash or pwsh)'
        required: true
        default: 'bash'
        type: choice
        options:
          - bash
          - pwsh
      command:
        description: 'Command to run (e.g., npm test or node scripts/... )'
        required: true
        default: 'npm test'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ai-roomchat/package-lock.json
      - name: Install deps
        working-directory: ai-roomchat
        run: npm ci
      - name: Run command (bash)
        if: ${{ inputs.shell == 'bash' }}
        working-directory: ai-roomchat
        env:
          # Do NOT hardcode a development password here. Use a repository or environment
          # secret named ADMIN_PORTAL_PASSWORD for CI runs if needed. If the secret is not
          # set the application should fall back to a safer default or fail explicitly.
          ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
        run: |
          echo ">>> ${{ inputs.command }}"
          ${{ inputs.command }}
      - name: Run command (PowerShell)
        if: ${{ inputs.shell == 'pwsh' }}
        shell: pwsh
        working-directory: ai-roomchat
        env:
          ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
        run: |
          Write-Host ">>> ${{ inputs.command }}"
          Invoke-Expression "${{ inputs.command }}"

